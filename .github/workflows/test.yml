name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipes:
    name: Recipes (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, typescript, java, csharp, go, rust, ruby, c]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install libpq
        if: matrix.language == 'c' || matrix.language == 'ruby'
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        if: matrix.language == 'typescript'
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '1.25'

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'rust'

      - uses: ruby/setup-ruby@v1
        if: matrix.language == 'ruby'
        with:
          ruby-version: '3.4'

      - name: Test recipes
        run: scripts/test_recipes.sh ${{ matrix.language }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Zensical
        run: pip install zensical

      - name: Check tab groups and code sections
        run: python3 scripts/check_tabs.py

      - name: Build the site
        run: zensical build --strict

      - name: Render and build the published copy
        run: |
          python3 scripts/render_docs.py --output build/published
          cd build/published && zensical build --strict
