name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so that the Starfleet recipes (which run only on a schedule or
  # by hand) and the published products are checked regularly.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Other events
# are never cancelled, so that a scheduled or manual Starfleet run, which
# creates databases that cost money, always reaches its clean-up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each recipe job runs only when something it depends on has changed; the
# changes job decides which. The filtering is done per job rather than
# with a paths filter on the workflow, because the Publish workflow waits
# for a successful Test run, and a push that changes only the
# documentation must still be published. A skipped job does not fail the
# run.
jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      recipes: ${{ steps.filter.outputs.recipes }}
      rag_server: ${{ steps.filter.outputs.rag_server }}
      workbench: ${{ steps.filter.outputs.workbench }}
      extensions: ${{ steps.filter.outputs.extensions }}
      control_plane: ${{ steps.filter.outputs.control_plane }}
      postgres_mcp: ${{ steps.filter.outputs.postgres_mcp }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      # The whole history, so that the commit before a push is available.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A scheduled or manual run tests everything, and so does a push whose
      # previous commit is unknown (a new branch, or a force push). For a
      # pull request, the checkout is GitHub's merge commit, and its first
      # parent is the base branch, so the difference between the two is
      # exactly what the pull request changes.
      - name: Decide which jobs to run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all=false
          files=""
          case "$EVENT" in
            push)
              if [[ "$BEFORE" =~ ^0*$ ]] ||
                 ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                all=true
              else
                files="$(git -c core.quotePath=false diff --name-only --no-renames "$BEFORE" HEAD)"
              fi
              ;;
            pull_request)
              files="$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD)"
              ;;
            *)
              all=true
              ;;
          esac

          recipes=$all rag_server=$all workbench=$all extensions=$all
          control_plane=$all
          postgres_mcp=$all
          while IFS= read -r file; do
            case "$file" in
              # Everything that every recipe job runs.
              .github/workflows/test.yml | \
              scripts/test_recipes.sh | scripts/run_example.sh)
                recipes=true rag_server=true workbench=true extensions=true
                control_plane=true
                postgres_mcp=true
                ;;
              # The test server is not used by the Control Plane job.
              scripts/start_test_server.sh | scripts/test_server/*)
                recipes=true rag_server=true workbench=true extensions=true
                postgres_mcp=true
                ;;
              scripts/start_rag_server.sh | scripts/fixtures/* | \
              recipes/rag_server/* | docs/rag_server/*)
                rag_server=true
                ;;
              scripts/start_workbench.sh | \
              recipes/ai_dba_workbench/* | docs/ai_dba_workbench/*)
                workbench=true
                ;;
              recipes/snowflake/* | docs/snowflake/* | \
              recipes/vectorizer/* | docs/vectorizer/* | \
              recipes/semantic_cache/* | docs/semantic_cache/*)
                extensions=true
                ;;
              scripts/start_control_plane.sh | \
              recipes/control_plane/* | docs/control_plane/*)
                control_plane=true
                ;;
              scripts/start_postgres_mcp.sh | \
              recipes/postgres_mcp/* | docs/postgres_mcp/*)
                postgres_mcp=true
                ;;
              # Starfleet runs only by hand and on the schedule.
              recipes/starfleet/* | docs/starfleet/*)
                ;;
              # The recipes job tests every other directory under recipes/.
              recipes/* | docs/postgresql/* | docs/go_llm_lib/*)
                recipes=true
                ;;
            esac
          done <<<"$files"

          server=false
          if [[ "$recipes$rag_server$workbench$extensions$postgres_mcp" == *true* ]]; then
            server=true
          fi

          echo "Event: $EVENT; testing everything: $all"
          [[ -n "$files" ]] && printf 'Changed:\n%s\n' "$files"
          for job in recipes rag_server workbench extensions control_plane postgres_mcp server; do
            echo "$job=${!job}" | tee -a "$GITHUB_OUTPUT"
          done

  # Every recipe job runs the same test server image, which takes several
  # minutes to build, so it is built once and kept in the Actions cache
  # under a key made from the Dockerfile's hash; later runs reuse it until
  # the Dockerfile changes. The job starts a server from the new image
  # before saving it, which also builds it (the start script names the
  # image), and checks that it works.
  test_server_image:
    name: Test server image
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Make the cache key
        id: key
        run: |
          echo "key=cookbook-test-server-${{ hashFiles('scripts/test_server/Dockerfile') }}" \
            >> "$GITHUB_OUTPUT"

      - name: Look for the image in the cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/test-server-image
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Build and check the image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          scripts/start_test_server.sh --name cookbook-image-check \
            --port 5432 >/dev/null
          image="$(docker inspect --format '{{.Config.Image}}' cookbook-image-check)"
          docker rm -f cookbook-image-check >/dev/null
          mkdir -p "$RUNNER_TEMP/test-server-image"
          docker save --output "$RUNNER_TEMP/test-server-image/image.tar" "$image"

      - name: Save the image to the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/test-server-image
          key: ${{ steps.key.outputs.key }}

  recipes:
    name: Recipes (${{ matrix.language }})
    needs: [changes, test_server_image]
    if: needs.changes.outputs.recipes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [python, typescript, java, csharp, go, rust, ruby, c]

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      # The start script builds the image itself if the cache has lost it.
      - name: Restore the test server image
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/test-server-image
          key: ${{ needs.test_server_image.outputs.cache-key }}

      - name: Load the test server image
        run: |
          if [[ -f "$RUNNER_TEMP/test-server-image/image.tar" ]]; then
            docker load --input "$RUNNER_TEMP/test-server-image/image.tar"
            rm -rf "$RUNNER_TEMP/test-server-image"
          else
            echo "::warning::The test server image is not in the cache, so it will be built"
          fi

      # The test server is the cookbook-test-server image (pgEdge Postgres
      # with the extensions that the recipes use) with TLS on and trust
      # authentication, so no password is needed. The script prints the
      # path of the CA certificate that the TLS recipe verifies against.
      - name: Start PostgreSQL
        run: |
          scripts/start_test_server.sh --port 5432 > "$RUNNER_TEMP/server.env"
          tee -a "$GITHUB_ENV" < "$RUNNER_TEMP/server.env"

      - name: Install libpq
        if: matrix.language == 'c' || matrix.language == 'ruby'
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        if: matrix.language == 'typescript'
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          # The Go LLM recipes' go.mod files require go 1.26.10.
          go-version: '1.26.10'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: matrix.language == 'rust'
        with:
          toolchain: stable

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        if: matrix.language == 'ruby'
        with:
          ruby-version: '3.4'

      # The LLM library recipes default to a local Ollama server. The
      # models are large, so cache them between runs.
      - name: Cache Ollama models
        if: matrix.language == 'go'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          # Bump the suffix when a model tag is re-published upstream, or the
          # stale cache is restored and the new layers are never saved.
          key: ollama-models-qwen2.5-1.5b-nomic-embed-text-v1

      # The installer may start a system service that keeps its models
      # elsewhere; run our own server as this user so that it uses the
      # cached ~/.ollama/models directory. It listens on every address, so
      # that the test server's vectorizer can reach it at
      # host.docker.internal as well.
      - name: Install Ollama and pull models
        if: matrix.language == 'go'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_HOST=0.0.0.0:11434 \
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:11434/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:11434/
          ollama pull qwen2.5:1.5b
          ollama pull nomic-embed-text

      - name: Check that the test server can reach Ollama
        if: matrix.language == 'go'
        run: >-
          docker exec cookbook-test-pg
          curl -fsS --max-time 10 http://host.docker.internal:11434/

      # The HTTP API recipes need their products running, and the extension
      # recipes are psql scripts, so they have jobs of their own below.
      - name: Test recipes
        env:
          # Recipes that list a variable in requires.txt run only when the
          # secret exists, so forks without the secret skip them.
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: >-
          scripts/test_recipes.sh
          --exclude recipes/rag_server
          --exclude recipes/ai_dba_workbench
          --exclude recipes/starfleet
          --exclude recipes/snowflake
          --exclude recipes/vectorizer
          --exclude recipes/semantic_cache
          --exclude recipes/postgres_mcp
          --exclude recipes/control_plane
          ${{ matrix.language }}

  # The Snowflake, Vectorizer and Semantic Cache recipes are psql scripts.
  # The vectorizer's background worker in the test server embeds text
  # through Ollama, so Ollama must be running with nomic-embed-text pulled
  # before the recipes start; the recipes wait for the worker themselves.
  extensions:
    name: Recipes (extensions)
    needs: [changes, test_server_image]
    if: needs.changes.outputs.extensions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Restore the test server image
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/test-server-image
          key: ${{ needs.test_server_image.outputs.cache-key }}

      - name: Load the test server image
        run: |
          if [[ -f "$RUNNER_TEMP/test-server-image/image.tar" ]]; then
            docker load --input "$RUNNER_TEMP/test-server-image/image.tar"
            rm -rf "$RUNNER_TEMP/test-server-image"
          else
            echo "::warning::The test server image is not in the cache, so it will be built"
          fi

      - name: Install psql and jq
        run: |
          if ! command -v psql >/dev/null || ! command -v jq >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client jq
          fi

      # Only nomic-embed-text is needed here, but the other jobs' cache
      # already holds it, so restore that cache rather than keep another.
      - name: Restore the Ollama models
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-qwen2.5-1.5b-nomic-embed-text-v1

      # Listen on every address, so that the test server's vectorizer can
      # reach Ollama at host.docker.internal.
      - name: Install Ollama and pull the embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_HOST=0.0.0.0:11434 \
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:11434/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:11434/
          ollama pull nomic-embed-text

      - name: Start PostgreSQL
        run: |
          scripts/start_test_server.sh --port 5432 > "$RUNNER_TEMP/server.env"
          tee -a "$GITHUB_ENV" < "$RUNNER_TEMP/server.env"

      # Ask for an embedding from inside the container, the way the
      # vectorizer will, which also loads the model before the recipes run.
      - name: Check that the test server can embed text through Ollama
        run: |
          docker exec cookbook-test-pg curl -fsS --max-time 120 \
            http://host.docker.internal:11434/api/embed \
            -d '{"model": "nomic-embed-text", "input": "cookbook"}' \
            | jq -e '.embeddings[0] | length == 768'

      - name: Test recipes
        run: |
          scripts/test_recipes.sh --dir recipes/snowflake \
            --dir recipes/vectorizer --dir recipes/semantic_cache sql

      - name: Show the server and Ollama logs
        if: failure()
        run: |
          docker logs cookbook-test-pg || true
          cat "$RUNNER_TEMP/ollama.log" || true

  rag_server:
    name: Recipes (RAG Server)
    needs: [changes, test_server_image]
    if: needs.changes.outputs.rag_server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      # The prepare_data recipe runs only when this is set.
      OLLAMA_URL: http://localhost:11434

    steps:
      - uses: actions/checkout@v4

      - name: Restore the test server image
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/test-server-image
          key: ${{ needs.test_server_image.outputs.cache-key }}

      - name: Load the test server image
        run: |
          if [[ -f "$RUNNER_TEMP/test-server-image/image.tar" ]]; then
            docker load --input "$RUNNER_TEMP/test-server-image/image.tar"
            rm -rf "$RUNNER_TEMP/test-server-image"
          else
            echo "::warning::The test server image is not in the cache, so it will be built"
          fi

      # The product containers reach the test server by name on a shared
      # network.
      - name: Start PostgreSQL
        run: |
          scripts/start_test_server.sh --network cookbook-ci --port 5432 \
            > "$RUNNER_TEMP/server.env"
          tee -a "$GITHUB_ENV" < "$RUNNER_TEMP/server.env"

      # libpq for the Ruby driver, as in the recipes job.
      - name: Install psql, jq and libpq
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq libpq-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.4'

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-qwen2.5-1.5b-nomic-embed-text-v1

      # Listen on every address, so that containers can reach Ollama at
      # host.docker.internal as well as the host itself.
      - name: Install Ollama and pull models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_HOST=0.0.0.0:11434 \
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:11434/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:11434/
          ollama pull qwen2.5:1.5b
          ollama pull nomic-embed-text

      - name: Check that the test server can reach Ollama
        run: >-
          docker exec cookbook-test-pg
          curl -fsS --max-time 10 http://host.docker.internal:11434/

      - name: Start the RAG Server
        run: |
          scripts/start_rag_server.sh --network cookbook-ci \
            --pg-host cookbook-test-pg --pg-port 5432 \
            > "$RUNNER_TEMP/rag.env"
          tee -a "$GITHUB_ENV" < "$RUNNER_TEMP/rag.env"

      - name: Test recipes
        if: hashFiles('recipes/rag_server/**') != ''
        run: >-
          scripts/test_recipes.sh --dir recipes/rag_server
          --exclude recipes/rag_server/row_level_security
          python typescript java csharp go rust ruby curl

      # Per-request identity is a server-wide setting, so the row-level
      # security recipe needs a second server of its own. Its variables
      # replace the first server's for the next step only.
      - name: Start the RAG Server with per-request identity
        run: |
          scripts/start_rag_server.sh --identity --network cookbook-ci \
            --pg-host cookbook-test-pg --pg-port 5432 --port 8081 \
            > "$RUNNER_TEMP/rag-identity.env"

      - name: Test the row-level security recipe
        if: hashFiles('recipes/rag_server/row_level_security/**') != ''
        run: |
          set -a
          . "$RUNNER_TEMP/rag-identity.env"
          set +a
          scripts/test_recipes.sh --dir recipes/rag_server/row_level_security \
            python typescript java csharp go rust ruby curl

      - name: Show the RAG Server logs
        if: failure()
        run: |
          docker logs cookbook-rag-server || true
          docker logs cookbook-rag-server-identity || true

  # The MCP Server recipes are API recipes in every language except C. The
  # start script embeds its sample data through the test server's
  # vectorizer, and the server embeds search text itself, both through
  # Ollama with nomic-embed-text.
  postgres_mcp:
    name: Recipes (Postgres MCP Server)
    needs: [changes, test_server_image]
    if: needs.changes.outputs.postgres_mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Restore the test server image
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/test-server-image
          key: ${{ needs.test_server_image.outputs.cache-key }}

      - name: Load the test server image
        run: |
          if [[ -f "$RUNNER_TEMP/test-server-image/image.tar" ]]; then
            docker load --input "$RUNNER_TEMP/test-server-image/image.tar"
            rm -rf "$RUNNER_TEMP/test-server-image"
          else
            echo "::warning::The test server image is not in the cache, so it will be built"
          fi

      # The MCP Server reaches the test server by name on a shared network,
      # and verifies its certificate, which names the container.
      - name: Start PostgreSQL
        run: |
          scripts/start_test_server.sh --network cookbook-ci --port 5432 \
            > "$RUNNER_TEMP/server.env"
          tee -a "$GITHUB_ENV" < "$RUNNER_TEMP/server.env"

      - name: Install psql and jq
        run: |
          if ! command -v psql >/dev/null || ! command -v jq >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client jq
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.4'

      # Only nomic-embed-text is needed here, but the other jobs' cache
      # already holds it, so restore that cache rather than keep another.
      - name: Restore the Ollama models
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-qwen2.5-1.5b-nomic-embed-text-v1

      # Listen on every address, so that the test server and the MCP Server
      # can reach Ollama at host.docker.internal.
      - name: Install Ollama and pull the embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_HOST=0.0.0.0:11434 \
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:11434/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:11434/
          ollama pull nomic-embed-text

      # Ask for an embedding from inside the container, the way the
      # vectorizer will, which also loads the model before the seeding.
      - name: Check that the test server can embed text through Ollama
        run: |
          docker exec cookbook-test-pg curl -fsS --max-time 120 \
            http://host.docker.internal:11434/api/embed \
            -d '{"model": "nomic-embed-text", "input": "cookbook"}' \
            | jq -e '.embeddings[0] | length == 768'

      # The token is generated for this run only, but mask it anyway before
      # it reaches the environment file.
      - name: Start the MCP Server
        run: |
          scripts/start_postgres_mcp.sh --network cookbook-ci \
            --pg-host cookbook-test-pg --pg-port 5432 \
            --pg-sslmode verify-full \
            > "$RUNNER_TEMP/mcp.env"
          sed -n 's/^MCP_TOKEN=/::add-mask::/p' "$RUNNER_TEMP/mcp.env"
          cat "$RUNNER_TEMP/mcp.env" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/mcp.env"

      - name: Test recipes
        run: |
          scripts/test_recipes.sh --dir recipes/postgres_mcp \
            python typescript java csharp go rust ruby curl

      - name: Show the server and Ollama logs
        if: failure()
        run: |
          docker logs cookbook-postgres-mcp || true
          docker logs cookbook-test-pg || true
          cat "$RUNNER_TEMP/ollama.log" || true

      - name: Stop the servers
        if: always()
        run: docker rm -f -v cookbook-postgres-mcp cookbook-test-pg || true

  workbench:
    name: Recipes (AI DBA Workbench)
    needs: [changes, test_server_image]
    if: needs.changes.outputs.workbench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Restore the test server image
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/test-server-image
          key: ${{ needs.test_server_image.outputs.cache-key }}

      - name: Load the test server image
        run: |
          if [[ -f "$RUNNER_TEMP/test-server-image/image.tar" ]]; then
            docker load --input "$RUNNER_TEMP/test-server-image/image.tar"
            rm -rf "$RUNNER_TEMP/test-server-image"
          else
            echo "::warning::The test server image is not in the cache, so it will be built"
          fi

      # The product containers reach the test server by name on a shared
      # network.
      - name: Start PostgreSQL
        run: |
          scripts/start_test_server.sh --network cookbook-ci --port 5432 \
            > "$RUNNER_TEMP/server.env"
          tee -a "$GITHUB_ENV" < "$RUNNER_TEMP/server.env"

      # libpq for the Ruby driver, as in the recipes job.
      - name: Install psql, jq and libpq
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq libpq-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.4'

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-qwen2.5-1.5b-nomic-embed-text-v1

      # Listen on every address, so that containers can reach Ollama at
      # host.docker.internal as well as the host itself.
      - name: Install Ollama and pull models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_HOST=0.0.0.0:11434 \
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:11434/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:11434/
          ollama pull qwen2.5:1.5b
          ollama pull nomic-embed-text

      - name: Check that the test server can reach Ollama
        run: >-
          docker exec cookbook-test-pg
          curl -fsS --max-time 10 http://host.docker.internal:11434/

      # The token and the password are generated for this run only, but
      # mask them anyway before they reach the environment file.
      - name: Start the AI DBA Workbench
        run: |
          scripts/start_workbench.sh --name cookbook-workbench \
            --network cookbook-ci \
            --pg-host cookbook-test-pg --pg-port 5432 \
            > "$RUNNER_TEMP/workbench.env"
          sed -n 's/^WORKBENCH_\(TOKEN\|PASSWORD\)=/::add-mask::/p' \
            "$RUNNER_TEMP/workbench.env"
          cat "$RUNNER_TEMP/workbench.env" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/workbench.env"

      - name: Test recipes
        if: hashFiles('recipes/ai_dba_workbench/**') != ''
        run: >-
          scripts/test_recipes.sh --dir recipes/ai_dba_workbench
          python typescript java csharp go rust ruby curl

      - name: Show the Workbench logs
        if: failure()
        run: docker compose -p cookbook-workbench logs || true

  # The Control Plane recipes call the API of a pgEdge Control Plane on
  # Docker Swarm, and connect to the cookbook database that the start
  # script creates on it, so they need no test server. Starting it takes
  # about 35 seconds once the images are pulled, and stopping it about 25.
  control_plane:
    name: Recipes (Control Plane)
    needs: changes
    if: needs.changes.outputs.control_plane == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v4

      # libpq for the Ruby driver, as in the recipes job.
      - name: Install psql, jq and libpq
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq libpq-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.4'

      # The start script pulls these itself if they are missing; pulling
      # them first keeps the download out of its time limits.
      - name: Pull the Control Plane and database images
        run: |
          docker pull -q ghcr.io/pgedge/control-plane:v0.11.0
          docker pull -q ghcr.io/pgedge/pgedge-postgres:18.6-spock5.0.12-standard-1
          docker pull -q busybox:1.37

      # The database password is generated for this run only, but mask it
      # anyway before it reaches the environment file.
      - name: Start the Control Plane
        run: |
          scripts/start_control_plane.sh > "$RUNNER_TEMP/control-plane.env"
          sed -n 's/^CONTROL_PLANE_DATABASE_PASSWORD=/::add-mask::/p' \
            "$RUNNER_TEMP/control-plane.env"
          cat "$RUNNER_TEMP/control-plane.env" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/control-plane.env"

      # The create_database recipe puts its database on the port below,
      # beside the cookbook database on the start script's default, 6432.
      - name: Test recipes
        if: hashFiles('recipes/control_plane/**') != ''
        env:
          CONTROL_PLANE_RECIPE_PORT: '6433'
        run: |
          scripts/test_recipes.sh --dir recipes/control_plane \
            python typescript java csharp go rust ruby curl

      - name: Show the Control Plane log
        if: failure()
        run: docker logs --tail 300 cookbook-control-plane || true

      - name: Stop the Control Plane
        if: always()
        run: scripts/start_control_plane.sh --stop

  # The Starfleet recipes create billable resources (always named
  # cookbook-..., and always deleted again), so they run only by hand and
  # on the weekly schedule, one run at a time. Without the credentials
  # (before they are configured, say, or on a fork) the job skips its
  # steps and succeeds.
  #
  # The programs delete what they create, but a cancelled run is stopped
  # before they can finish, and a run that exceeds a time limit is killed
  # the same way, so the last step sweeps up whatever is left. The
  # credentials go only to the steps that call the API, so that the setup
  # actions and the dependency installs never see them.
  starfleet:
    name: Recipes (Starfleet)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # The test step has 240 minutes, which is 10 minutes for each of the 24
    # programs that create a database (the create_database,
    # connect_database, and rotate_password recipes, in eight languages
    # each); each took under two minutes in testing, but a database can
    # take a few minutes to become available and a few more to delete. The
    # builds, the dependency installs, and the quick recipes share those
    # 240 minutes. The remaining 45 minutes are for setting up the tools and
    # for the 20-minute sweep, so the job ends before the 360-minute limit
    # could cut a clean-up short.
    timeout-minutes: 285
    concurrency:
      group: starfleet-recipes
      cancel-in-progress: false

    steps:
      # Secrets cannot appear in an if: condition, so check them here. The
      # step also records when the job started, for the final sweep.
      - name: Check for the Starfleet credentials
        id: credentials
        env:
          STARFLEET_CLIENT_ID: ${{ secrets.STARFLEET_CLIENT_ID }}
          STARFLEET_CLIENT_SECRET: ${{ secrets.STARFLEET_CLIENT_SECRET }}
        run: |
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          missing=""
          for name in STARFLEET_CLIENT_ID STARFLEET_CLIENT_SECRET; do
            if [[ -z "${!name:-}" ]]; then missing+=" $name"; fi
          done
          if [[ -n "$missing" ]]; then
            echo "::notice::Skipping the Starfleet recipes; these secrets are not set:$missing"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'

      # libpq for the Ruby driver, as in the recipes job.
      - name: Install psql, jq and libpq
        if: steps.credentials.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq libpq-dev

      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.available == 'true'
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-dotnet@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-go@v5
        if: steps.credentials.outputs.available == 'true'
        with:
          go-version: '1.26.10'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.credentials.outputs.available == 'true'
        with:
          toolchain: stable

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        if: steps.credentials.outputs.available == 'true'
        with:
          ruby-version: '3.4'

      - name: Test recipes
        if: >-
          steps.credentials.outputs.available == 'true' &&
          hashFiles('recipes/starfleet/**') != ''
        timeout-minutes: 240
        env:
          STARFLEET_CLIENT_ID: ${{ secrets.STARFLEET_CLIENT_ID }}
          STARFLEET_CLIENT_SECRET: ${{ secrets.STARFLEET_CLIENT_SECRET }}
        # The backups and branches recipes are not run here: the API has no
        # way to delete a backup, and each run leaves one behind (a branch
        # create also cuts a backup).
        run: >-
          scripts/test_recipes.sh --dir recipes/starfleet
          --exclude recipes/starfleet/backups
          --exclude recipes/starfleet/branches
          python typescript java csharp go rust ruby curl

      # Runs after a failure, a cancellation, and a timeout of the test
      # step. The account may hold other people's databases, so the step
      # deletes only a database that has a name starting with cookbook,
      # a display name starting with cookbook-, and a creation time at or
      # after the start of this job. The API reports creation times as
      # strings with no stated format, so a database whose time the step
      # cannot read is reported and left alone.
      - name: Delete any database that the run left behind
        if: always() && steps.credentials.outputs.available == 'true'
        timeout-minutes: 20
        env:
          STARFLEET_CLIENT_ID: ${{ secrets.STARFLEET_CLIENT_ID }}
          STARFLEET_CLIENT_SECRET: ${{ secrets.STARFLEET_CLIENT_SECRET }}
          STARTED: ${{ steps.credentials.outputs.started }}
        run: |
          set -euo pipefail
          base="${STARFLEET_API_URL:-https://api.pgedge.com}"

          # jq builds the body from the environment and curl reads it from
          # standard input, so the secret never appears in a process list.
          token="$(jq -n '{grant_type: "client_credentials",
                           client_id: env.STARFLEET_CLIENT_ID,
                           client_secret: env.STARFLEET_CLIENT_SECRET}' |
            curl --silent --show-error --fail --max-time 30 \
              --header 'Content-Type: application/json' --data @- \
              "$base/account/v1/oauth/token" | jq -er '.access_token')"
          echo "::add-mask::$token"

          # The --config option keeps the token off the command line.
          api() {
            curl --silent --show-error --max-time 30 \
              --config <(printf 'header = "Authorization: Bearer %s"\n' "$token") \
              "$@"
          }

          databases="$(api --fail "$base/managed/v1/databases?limit=100&descending=true")"

          # Reads a creation time as RFC 3339, with or without fractions of
          # a second; any other form gives null.
          filter='
            def seconds: sub("\\.[0-9]+"; "") | sub("[+-]00:?00$"; "Z")
              | try fromdateiso8601 catch null;
            ($started | fromdateiso8601) as $start
            | .[]
            | select((.name // "" | startswith("cookbook"))
                     and (.display_name // "" | startswith("cookbook-")))
            | (.created_at // "" | seconds) as $created
            | if $created == null then "skip \(.id)"
              elif $created >= $start then "delete \(.id)"
              else empty end'
          plan="$(jq -r --arg started "$STARTED" "$filter" <<<"$databases")"

          failed=0
          deadline=$((SECONDS + 900))
          while read -r action id; do
            [[ -n "${action:-}" ]] || continue
            if [[ "$action" == skip ]]; then
              echo "::warning::Not deleting cookbook database $id: its creation time could not be read"
              continue
            fi
            echo "Deleting leftover database $id"
            while true; do
              status="$(api --output /dev/null --write-out '%{http_code}' \
                --request DELETE "$base/managed/v1/databases/$id" || true)"
              case "$status" in
                204|404) break ;;
                000|409|429|5??) ;;
                *) echo "::error::Deleting database $id returned HTTP status $status"
                   failed=1; break ;;
              esac
              if ((SECONDS >= deadline)); then
                echo "::error::Database $id was still not deleted after the time limit; delete it by hand"
                failed=1; break
              fi
              sleep 15
            done
          done <<<"$plan"
          exit "$failed"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Zensical
        run: pip install zensical

      - name: Check tab groups and code sections
        run: python3 scripts/check_tabs.py

      - name: Build the site
        run: zensical build --strict

      - name: Render and build the published copy
        run: |
          python3 scripts/render_docs.py --output build/published
          cd build/published && zensical build --strict
