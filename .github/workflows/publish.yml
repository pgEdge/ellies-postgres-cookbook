# Publish the documentation to the published branch, with the code from
# each recipe inlined, once the tests have passed on main.
#
# The primary pgEdge documentation site imports only the docs/ directory of
# each source, so it cannot see the programs in recipes/ that the pages
# include. The published branch carries a self-contained copy instead, which
# the primary site imports like any other source:
#
#   !import https://github.com/pgEdge/ellies-postgres-cookbook.git?branch=published
#
# The branch holds generated output only, and each run replaces it with a
# single new commit; never edit it by hand.

name: Publish

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    # Publish only commits that passed the tests; a manual run publishes the
    # tip of main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}

      # Test runs for two quick pushes can finish out of order, so a run
      # for an older commit must not overwrite the published branch with
      # stale pages. A newer run that starts later cancels this one through
      # the concurrency group, which closes the remaining window.
      - name: Check that the commit is still the tip of main
        id: tip
        run: |
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$(git rev-parse HEAD)" != "$tip" ]]; then
              echo "main has moved on to $tip; skipping this publish"
              echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.tip.outputs.stale != 'true'
        with:
          python-version: '3.13'

      - name: Install the renderer's dependencies
        if: steps.tip.outputs.stale != 'true'
        run: pip install pymdown-extensions pyyaml

      - name: Render the documentation
        if: steps.tip.outputs.stale != 'true'
        run: |
          python3 scripts/render_docs.py \
              --output build/published --commit "$(git rev-parse HEAD)"

      - name: Push the published branch
        if: steps.tip.outputs.stale != 'true'
        working-directory: build/published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          git init --quiet --initial-branch published
          git add --all
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --message "Publish $source"
          git push --force --quiet \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              published
