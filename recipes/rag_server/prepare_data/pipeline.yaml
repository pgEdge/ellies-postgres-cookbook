pipelines:
  - name: "gadget"
    description: "Questions about the Acme Gadget"
    database:
      host: "localhost"
      port: 5432
      database: "postgres"
      username: "postgres"
      password: ""
      ssl_mode: "prefer"
    tables:
      - table: "cookbook_prepare_data"
        text_column: "content"
        vector_column: "embedding"
        id_column: "id"
    embedding_llm:
      provider: "ollama"
      model: "nomic-embed-text"
      base_url: "http://localhost:11434"
    rag_llm:
      provider: "ollama"
      model: "qwen2.5:1.5b"
      base_url: "http://localhost:11434"
    token_budget: 2000
    top_n: 3
