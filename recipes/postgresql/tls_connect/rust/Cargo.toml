[package]
name = "tls_connect"
version = "0.1.0"
edition = "2021"
publish = false

# --8<-- [start:deps]
[dependencies]
# The synchronous client; tokio-postgres is the asynchronous equivalent.
postgres = "0.19"
# TLS support for rust-postgres, using OpenSSL through the openssl crate.
postgres-openssl = "0.5"
openssl = "0.10"
# --8<-- [end:deps]
